<script>
  /* La llave sólo aparece en la home. Precargarla desde el HTML estático la
     descargaría también en /aprender, /libre y /acerca, donde no se usa.
     La ruta vive en el hash, así que se puede decidir aquí mismo. */
  (function () {
    var r = location.hash.replace(/^#/, '');
    if (r && r !== '/') return;
    var l = document.createElement('link');
    l.rel = 'preload';
    l.as = 'image';
    l.href = 'assets/telegraph.webp';
    l.imageSrcset = 'assets/telegraph-560.webp 560w, assets/telegraph.webp 866w';
    l.imageSizes = '(max-width: 767px) 118vw, 58vw';
    document.head.appendChild(l);
  })();
</script>
